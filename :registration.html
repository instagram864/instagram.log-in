<html lang="ru"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== MAIN CONTENT ===== */
    .main {
      flex: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 32px 0;
      gap: 28px;
    }

    /* ---- Instagram wordmark SVG placeholder ---- */
    .logo-wordmark {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    /* ---- Tagline ---- */
    .tagline {
      font-size: 24px;
      font-weight: 300;
      line-height: 1.3;
      text-align: center;
      color: #ffffff;
    }

    .tagline .highlight {
      /* gradient: orange → pink, matching Instagram promo style */
      background: linear-gradient(90deg, #f77737 0%, #e1306c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ---- Open button ---- */
    .btn-open {
      width: 100%;
      padding: 16px;
      background-color: #4c6ef5;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-open:hover {
      background-color: #3b5de0;
    }

    /* ---- Login / register line ---- */
    .auth-line {
      font-size: 15px;
      color: #888;
      text-align: center;
    }

    .auth-line a {
      color: #4c6ef5;
      text-decoration: none;
      font-weight: 400;
    }

    .auth-line .register {
      color: #4c6ef5;
      font-weight: 400;
    }

    /* ===== BOTTOM: from Meta + nav bar ===== */
    .bottom {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* "from Meta" block */
    .from-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 24px 0 20px;
    }

    .from-text {
      font-size: 12px;
      color: #555;
      letter-spacing: 0.3px;
    }

    /* ---- Nav bar ---- */
    .nav-bar {
      width: 100%;
      background-color: #0a0a0a;
      border-top: 1px solid #1f1f1f;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0 20px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
    }
  </style>
</head>
